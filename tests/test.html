<script>
/* tiny browser runner with the parts of node:test / node:assert the spec uses */
(async function () {
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const show = v => { try { return JSON.stringify(v); } catch (e) { return String(v); } };
  function deepEq(a, b) {
    if (Object.is(a, b)) return true;
    if (typeof a !== 'object' || typeof b !== 'object' || !a || !b || Array.isArray(a) !== Array.isArray(b)) return false;
    const ka = Object.keys(a), kb = Object.keys(b);
    return ka.length === kb.length && ka.every(k => Object.prototype.hasOwnProperty.call(b, k) && deepEq(a[k], b[k]));
  }
  const fail = (msg, a, b) => { throw new Error((msg ? msg + '\n' : '') + 'actual:   ' + show(a) + '\nexpected: ' + show(b)); };
  const assert = {
    equal: (a, b, m) => { if (!Object.is(a, b)) fail(m, a, b); },
    notEqual: (a, b, m) => { if (Object.is(a, b)) fail((m || '') + ' (should differ)', a, b); },
    deepEqual: (a, b, m) => { if (!deepEq(a, b)) fail(m, a, b); },
    ok: (v, m) => { if (!v) throw new Error(m || 'expected a truthy value'); },
  };
  const groups = [];
  let cur = null;
  const describe = (name, fn) => { cur = { name, tests: [] }; groups.push(cur); fn(); cur = null; };
  const test = (name, fn) => cur.tests.push({ name, fn });   // the spec always calls test() inside describe()
  (window.KT_SPECS || []).forEach(spec => spec({ describe, test, assert, R: KT.rules, S: KT.store, C: KT.content, SEED: window.KT_SEED, V: KT.vault, X: KT.xlsx, E: KT.export }));

  let pass = 0, failN = 0, html = '';
  for (const g of groups) {
    html += `<div class="t-group">${esc(g.name)}</div>`;
    for (const t of g.tests) {
      try { await t.fn(); pass++; html += `<div class="t-row ok">✔ <span>${esc(t.name)}</span></div>`; }
      catch (e) { failN++; html += `<div class="t-row bad">✖ <span>${esc(t.name)}</span></div><div class="t-err">${esc(e && e.message || e)}</div>`; }
    }
  }
  document.getElementById('out').innerHTML = html;
  const sum = document.getElementById('sum');
  sum.textContent = failN ? `ไม่ผ่าน ${failN} จาก ${pass + failN} ข้อ` : `ผ่านทั้งหมด ${pass} ข้อ`;
  sum.className = 't-sum ' + (failN ? 'bad' : 'ok');
  document.title = (failN ? '✖ ' : '✔ ') + document.title;
})();
</script>
